name: API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - name: Install and Run golangci-lint
        run: |
          cd go_api
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          golangci-lint run --timeout=5m --out-format=colored-line-number

  build:
    name: Code Build
    runs-on: ubuntu-latest
    needs: golangci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - name: Install dependencies
        run: |
          cd go_api
          go mod download

      - name: Build Go binary
        run: |
          cd go_api
          go build -v ./...