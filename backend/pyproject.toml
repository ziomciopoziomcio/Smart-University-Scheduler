[tool.black]
line-length = 88
exclude = '''
/(
    alembic/versions
  | \.git
  | \.venv
  | venv
  | .*_pb2\.py
  | .*_pb2_grpc\.py
)/
'''

force-exclude = '.*_pb2\.py|.*_pb2_grpc\.py'

[tool.ruff]
line-length = 88
exclude = [
    "alembic/versions",
    ".git",
    ".venv",
    "venv",
   "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]
