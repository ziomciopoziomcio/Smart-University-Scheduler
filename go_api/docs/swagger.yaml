paths:
  /api/v1/academic-calendar:
    get:
      description: Returns paginated academic calendar entries
      parameters:
      - default: 10
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/academics_models.PaginatedAcademicCalendarResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get academic calendar
      tags:
      - Academic Calendar
    post:
      consumes:
      - application/json
      description: Creates a new academic calendar record.
      parameters:
      - description: Academic calendar data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/academics_dto.CreateAcademicCalendarRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
