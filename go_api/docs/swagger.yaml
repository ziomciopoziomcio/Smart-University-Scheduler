definitions:
  dto.AssignPermissionRequest:
    properties:
      permission_id:
        type: integer
    required:
      - permission_id
    type: object
  dto.CourseDetails:
    properties:
      course_code:
        type: integer
      course_name:
        type: string
      ects_points:
        type: integer
    type: object
  dto.CreateAcademicCalendarRequest:
    properties:
      academic_day_of_week:
        type: integer
      academic_year:
        type: string
      calendar_date:
        type: string
      description:
        type: string
      semester_type:
        type: string
      week_number:
        type: integer
    required:
      - academic_day_of_week
      - academic_year
      - calendar_date
      - semester_type
      - week_number
    type: object
  dto.CreateBuildingRequest:
    properties:
      building_name:
        type: string
      building_number:
        type: string
      campus_id:
        type: integer
    required:
      - building_name
      - building_number
      - campus_id
    type: object
  dto.CreateCampusRequest:
    properties:
      campus_name:
        type: string
      campus_short:
        type: string
    required:
      - campus_name
      - campus_short
    type: object
  dto.CreateCourseInstructorRequest:
    properties:
      class_type:
        type: string
      course:
        type: integer
      employee:
        type: integer
      hours:
        type: integer
    required:
      - class_type
      - course
      - employee
    type: object
  dto.CreateCourseRequest:
    properties:
      course_code:
        type: integer
      course_coordinator:
        type: integer
      course_language:
        type: string
      course_name:
        type: string
      ects_points:
        type: integer
      leading_unit:
        type: integer
    required:
      - course_code
      - course_coordinator
      - course_language
      - course_name
      - ects_points
      - leading_unit
    type: object
  dto.CreateCourseTypeDetailRequest:
    properties:
      class_hours:
        type: integer
      class_type:
        type: string
      course:
        type: integer
      frequency:
        type: string
      manual_weeks:
        items:
          type: integer
        type: array
      max_group_participants_number:
        type: integer
      pc_needed:
        type: boolean
      projector_needed:
        type: boolean
      slots_per_class:
        type: integer
    required:
      - class_type
      - course
    type: object
  dto.CreateCurriculumCourseRequest:
    properties:
      course:
        type: integer
      elective_block:
        type: integer
      major:
        type: integer
      semester:
        type: integer
      study_program:
        type: integer
    required:
      - course
      - semester
      - study_program
    type: object
  dto.CreateElectiveBlockRequest:
    properties:
      elective_block_name:
        type: string
      study_field:
        type: integer
    required:
      - elective_block_name
      - study_field
    type: object
  dto.CreateFacultyRequest:
    properties:
      faculty_name:
        type: string
      faculty_short:
        type: string
    required:
      - faculty_name
      - faculty_short
    type: object
  dto.CreateMajorRequest:
    properties:
      major_name:
        type: string
      study_field:
        type: integer
    required:
      - major_name
      - study_field
    type: object
  dto.CreatePermissionRequest:
    properties:
      code:
        type: string
      description:
        type: string
      group:
        type: string
      name:
        type: string
    required:
      - code
      - name
    type: object
  dto.CreateRoleRequest:
    properties:
      role_name:
        type: string
    required:
      - role_name
    type: object
  dto.CreateUserRequest:
    properties:
      degree:
        type: string
      email:
        type: string
      employee:
        $ref: '#/definitions/dto.EmployeeProfileDTO'
      name:
        type: string
      phone_number:
        type: string
      send_login_credentials_email:
        type: boolean
      student:
        $ref: '#/definitions/dto.StudentProfileDTO'
      surname:
        type: string
    required:
      - email
      - name
      - surname
    type: object
  dto.CurriculumCourseResponse:
    properties:
      course:
        type: integer
      course_details:
        $ref: '#/definitions/dto.CourseDetails'
      elective_block:
        type: integer
      elective_block_details:
        $ref: '#/definitions/models.ElectiveBlock'
      major:
        type: integer
      major_details:
        $ref: '#/definitions/models.MajorReadResponse'
      semester:
        type: integer
      study_program:
        type: integer
    type: object
  dto.EmployeeProfileDTO:
    properties:
      faculty_id:
        type: integer
      unit_id:
        type: integer
    type: object
  dto.GroupResponse:
    properties:
      elective_block:
        type: integer
      group_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      major:
        type: integer
      semester:
        type: integer
      study_program:
        type: integer
    type: object
  dto.StudentProfileDTO:
    properties:
      major_id:
        type: integer
      study_program_id:
        type: integer
    type: object
  models.AcademicCalendarResponse:
    properties:
      academic_day_of_week:
        type: integer
      academic_year:
        type: string
      calendar_date:
        type: string
      description:
        type: string
      semester_type:
        type: string
      week_number:
        type: integer
    type: object
  models.Building:
    properties:
      building_name:
        type: string
      building_number:
        type: string
      campus_id:
        type: integer
      id:
        type: integer
    type: object
  models.BuildingReadResponse:
    properties:
      building_name:
        type: string
      building_number:
        type: string
      campus_id:
        type: integer
      id:
        type: integer
      rooms_number:
        type: integer
    type: object
  models.Campus:
    properties:
      campus_name:
        type: string
      campus_short:
        type: string
      id:
        type: integer
    type: object
  models.Course:
    properties:
      course_code:
        type: integer
      course_coordinator:
        type: integer
      course_language:
        type: string
      course_name:
        type: string
      ects_points:
        type: integer
      leading_unit:
        type: integer
    type: object
  models.CourseTypeDetail:
    properties:
      class_hours:
        type: integer
      class_type:
        type: string
      course:
        type: integer
      frequency:
        type: string
      manual_weeks:
        items:
          type: integer
        type: array
      max_group_participants_number:
        type: integer
      pc_needed:
        type: boolean
      projector_needed:
        type: boolean
      slots_per_class:
        type: integer
    type: object
  models.CoursesInstructors:
    properties:
      class_type:
        type: string
      course:
        type: integer
      employee:
        type: integer
      hours:
        type: integer
    type: object
  models.CurriculumCourse:
    properties:
      course:
        type: integer
      course_ref:
        allOf:
          - $ref: '#/definitions/models.Course'
        description: Relations
      elective_block:
        type: integer
      elective_block_ref:
        $ref: '#/definitions/models.ElectiveBlock'
      major:
        type: integer
      major_ref:
        $ref: '#/definitions/models.Major'
      semester:
        type: integer
      study_program:
        type: integer
      study_program_ref:
        $ref: '#/definitions/models.StudyProgram'
    type: object
  models.ElectiveBlock:
    properties:
      elective_block_name:
        type: string
      id:
        type: integer
      study_field:
        type: integer
    type: object
  models.Faculty:
    properties:
      faculty_name:
        type: string
      faculty_short:
        type: string
      id:
        type: integer
    type: object
  models.FacultyReadWithCounterResponse:
    properties:
      faculty_name:
        type: string
      faculty_short:
        type: string
      id:
        type: integer
      lecturers_count:
        type: integer
      students_count:
        type: integer
    type: object
  models.Group:
    properties:
      elective_block:
        type: integer
      group_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      major:
        type: integer
      members:
        items:
          $ref: '#/definitions/models.GroupMember'
        type: array
      semester:
        type: integer
      study_program:
        type: integer
    type: object
  models.GroupMember:
    properties:
      group:
        type: integer
      student:
        type: integer
    type: object
  models.Major:
    properties:
      id:
        type: integer
      major_name:
        type: string
      study_field:
        type: integer
    type: object
  models.MajorReadResponse:
    properties:
      group_count:
        type: integer
      id:
        type: integer
      major_name:
        type: string
      study_field:
        type: integer
    type: object
  models.PaginatedAcademicCalendarResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.AcademicCalendarResponse'
        type: array
    type: object
  models.PaginatedBuildingsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.BuildingReadResponse'
        type: array
    type: object
  models.PaginatedCampusesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Campus'
        type: array
    type: object
  models.PaginatedCourseTypeDetailsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.CourseTypeDetail'
        type: array
    type: object
  models.PaginatedCoursesInstructorsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.CoursesInstructors'
        type: array
    type: object
  models.PaginatedCoursesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Course'
        type: array
    type: object
  models.PaginatedElectiveBlocksResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.ElectiveBlock'
        type: array
    type: object
  models.PaginatedFacultiesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.FacultyReadWithCounterResponse'
        type: array
    type: object
  models.PaginatedMajorsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.MajorReadResponse'
        type: array
    type: object
  models.PaginatedPermissionsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
    type: object
  models.PaginatedRolesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.RoleWithCountResponse'
        type: array
    type: object
  models.PaginatedRoomsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Room'
        type: array
    type: object
  models.PaginatedStudyFieldsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.StudyFieldListSummaryResponse'
        type: array
    type: object
  models.PaginatedStudyProgramsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.StudyProgramDetailResponse'
        type: array
    type: object
  models.PaginatedUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.UserResponse'
        type: array
    type: object
  models.Permission:
    properties:
      code:
        type: string
      description:
        type: string
      group:
        type: string
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
    type: object
  models.Role:
    properties:
      id:
        type: integer
      permissions:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
      role_name:
        type: string
    type: object
  models.RoleWithCountResponse:
    properties:
      id:
        type: integer
      permissions:
        items:
          $ref: '#/definitions/models.Permission'
        type: array
      role_name:
        type: string
      users_count:
        type: integer
    type: object
  models.Room:
    properties:
      building_id:
        type: integer
      faculty_id:
        type: integer
      id:
        type: integer
      pc_amount:
        type: integer
      projector_availability:
        type: boolean
      room_capacity:
        type: integer
      room_name:
        type: string
      unit_id:
        type: integer
    type: object
  models.SemesterSummary:
    properties:
      courses_count:
        type: integer
      ects_sum:
        type: integer
      semester_number:
        type: integer
    type: object
  models.StudyField:
    properties:
      degree:
        type: string
      faculty_id:
        type: integer
      field_name:
        type: string
      id:
        type: integer
      language:
        type: string
      mode:
        type: string
    type: object
  models.StudyFieldListSummaryResponse:
    properties:
      degree:
        type: string
      elective_blocks_count:
        type: integer
      faculty:
        type: integer
      field_name:
        type: string
      id:
        type: integer
      language:
        type: string
      mode:
        type: string
      programs_count:
        type: integer
      semesters_count:
        type: integer
      specializations_count:
        type: integer
    type: object
  models.StudyProgram:
    properties:
      id:
        type: integer
      program_name:
        type: string
      start_year:
        type: string
      study_field:
        type: integer
    type: object
  models.StudyProgramDetailResponse:
    properties:
      id:
        type: integer
      program_name:
        type: string
      semester_summary:
        items:
          $ref: '#/definitions/models.SemesterSummary'
        type: array
      semesters_count:
        type: integer
      start_year:
        type: string
      study_field:
        type: integer
    type: object
  models.Unit:
    properties:
      faculty_id:
        type: integer
      id:
        type: integer
      unit_name:
        type: string
      unit_short:
        type: string
    type: object
  models.UnitResponse:
    properties:
      courses_count:
        type: integer
      faculty_id:
        type: integer
      id:
        type: integer
      lecturers_count:
        type: integer
      unit_name:
        type: string
      unit_short:
        type: string
    type: object
  models.UnitsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.UnitResponse'
        type: array
    type: object
  models.UserDetailResponse:
    properties:
      created_at:
        type: string
      degree:
        type: string
      email:
        type: string
      employee:
        additionalProperties: true
        type: object
      id:
        type: integer
      name:
        type: string
      phone_number:
        type: string
      roles:
        items:
          type: string
        type: array
      student:
        additionalProperties: true
        type: object
      surname:
        type: string
      two_factor_enabled:
        type: boolean
    type: object
  models.UserResponse:
    properties:
      created_at:
        type: string
      degree:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone_number:
        type: string
      roles:
        items:
          type: string
        type: array
      surname:
        type: string
      two_factor_enabled:
        type: boolean
    type: object
info:
  contact: { }
paths:
  /api/v1/academic-calendar:
    get:
      description: Returns all academic calendar entries
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedAcademicCalendarResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get academic calendar
      tags:
        - Academic Calendar
    post:
      consumes:
        - application/json
      description: Creates a new academic calendar record.
      parameters:
        - description: Academic calendar data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateAcademicCalendarRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AcademicCalendarResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create academic calendar entry
      tags:
        - Academic Calendar
  /api/v1/buildings:
    get:
      description: Returns list of buildings with number of rooms
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedBuildingsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all buildings
      tags:
        - buildings
    post:
      consumes:
        - application/json
      description: Creates a new building.
      parameters:
        - description: Building data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateBuildingRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Building'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create building
      tags:
        - buildings
  /api/v1/campuses:
    get:
      description: Returns list of all campuses
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedCampusesResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all campuses
      tags:
        - campuses
    post:
      consumes:
        - application/json
      description: Creates a new campus.
      parameters:
        - description: Campus data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateCampusRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Campus'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create campus
      tags:
        - campuses
  /api/v1/course-type-details:
    get:
      description: Returns list of course type details sorted by course and class
        type
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedCourseTypeDetailsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get course type details
      tags:
        - course-type-details
    post:
      consumes:
        - application/json
      description: Creates a new course type detail entry.
      parameters:
        - description: Course type detail data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateCourseTypeDetailRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CourseTypeDetail'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create course type detail
      tags:
        - course-type-details
  /api/v1/courses:
    get:
      description: Returns list of all courses sorted by course code
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedCoursesResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all courses
      tags:
        - courses
    post:
      consumes:
        - application/json
      description: Creates a new course.
      parameters:
        - description: Course data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateCourseRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Course'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create course
      tags:
        - courses
  /api/v1/courses-instructors:
    get:
      description: Returns list of course-instructor assignments
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedCoursesInstructorsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get course instructors
      tags:
        - courses-instructors
    post:
      consumes:
        - application/json
      description: Assigns an employee to a course and class type (after validating
        course type existence)
      parameters:
        - description: Instructor assignment data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateCourseInstructorRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CoursesInstructors'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assign instructor to course
      tags:
        - courses-instructors
  /api/v1/curriculum-courses:
    get:
      description: Returns curriculum courses with course, major and elective block
        details (with aggregated group counts)
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/dto.CurriculumCourseResponse'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get curriculum courses
      tags:
        - curriculum-courses
    post:
      consumes:
        - application/json
      description: Creates a new curriculum course entry.
      parameters:
        - description: Curriculum course data
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/dto.CreateCurriculumCourseRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CurriculumCourse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create curriculum course
      tags:
        - curriculum-courses
  /api/v1/elective-blocks:
    get:
